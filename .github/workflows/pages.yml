import path from "node:path";
import { fileURLToPath } from "node:url";
import { Store } from "../lib/store.js";
import { collectTopNotes } from "../lib/collector.js";
import { analyzeNotes } from "../lib/analyzer.js";

const root = path.dirname(path.dirname(fileURLToPath(import.meta.url)));
const store = new Store(path.join(root, "data", "store.json"));
const data = await store.read();
const groups = await collectTopNotes({ keywords: data.settings.keywords });
const notes = groups.flatMap(group => group.notes.map((note, index) => ({ ...note, keyword: group.keyword, rank: index + 1 })));
await store.addRun({ id: crypto.randomUUID(), collectedAt: new Date().toISOString(), status: notes.length ? "complete" : "partial", groups, analysis: analyzeNotes(notes) });
console.log(`Collected ${notes.length} notes`);
